[project]
name = "cvo-demo"
version = "0.1.0"
description = "Demo project for Customer Value Optimization (CVO)."
readme = "README.md"
authors = [
    { name = "hreddy11", email = "github-user@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "fastapi[standard]>=0.142.2",
]

[project.scripts]
cvo-demo = "cvo_demo:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
